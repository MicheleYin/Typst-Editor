name: Build iPadOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iPadOS arm64 archive (unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Identify iOS toolchain
        id: ios-toolchain
        run: |
          toolchain_fingerprint="$({
            xcode-select -p
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } | shasum -a 256 | cut -c1-16)"
          echo "cache_key=$toolchain_fingerprint" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-target
          key: macos-ios-arm64-${{ steps.ios-toolchain.outputs.cache_key }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-ios-arm64-${{ steps.ios-toolchain.outputs.cache_key }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          echo "iOS SDK: $sdk_version"
          if (( sdk_major < 26 )); then
            echo "::error::iOS SDK 26 or later is required, found $sdk_version"
            exit 1
          fi

      - name: Initialize iOS project
        run: node scripts/tauri-cli.cjs ios init --ci --skip-targets-install

      - name: Enforce iOS deployment target
        run: |
          project_dir="src-tauri/gen/apple"
          sed -i '' "s/iOS: [0-9.]*$/iOS: $IPHONEOS_DEPLOYMENT_TARGET/" "$project_dir/project.yml"
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '$IPHONEOS_DEPLOYMENT_TARGET'/" "$project_dir/Podfile"
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = $IPHONEOS_DEPLOYMENT_TARGET;/g" "$project_dir/typst-editor.xcodeproj/project.pbxproj"
          sed -i '' 's|$(TOOLCHAIN_DIR)|$(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain|g' "$project_dir/project.yml"
          sed -i '' 's|$(TOOLCHAIN_DIR)|$(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain|g' "$project_dir/typst-editor.xcodeproj/project.pbxproj"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 2;/g' "$project_dir/typst-editor.xcodeproj/project.pbxproj"

      - name: Build unsigned iPadOS archive
        run: node scripts/tauri-cli.cjs ios build --target aarch64 --archive-only --no-sign

      - name: Verify archived app minimum iOS version
        run: |
          app="src-tauri/gen/apple/build/typst-editor_iOS.xcarchive/Products/Applications/Typst Editor.app"
          minimum_version="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")"
          echo "Archived app minimum iOS version: $minimum_version"
          if [[ "$minimum_version" != "$IPHONEOS_DEPLOYMENT_TARGET" ]]; then
            echo "::error::Expected iOS $IPHONEOS_DEPLOYMENT_TARGET, found iOS $minimum_version"
            exit 1
          fi
          device_families="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$app/Info.plist" | tr -d '[:space:]')"
          if [[ "$device_families" != "Array{2}" ]]; then
            echo "::error::Expected an iPad-only archive (UIDeviceFamily [2]), found $device_families"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: typst-editor-ipados-arm64-unsigned-${{ github.run_id }}
          path: src-tauri/gen/apple/build/typst-editor_iOS.xcarchive
          if-no-files-found: error
          retention-days: 14